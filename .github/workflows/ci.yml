name: CI

on:
  push:
    branches: [main, working]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Test
        # Network-marked tests are excluded: CI must not depend on the NVD API
        # being up, or on its rate limits.
        run: pytest -m "not network" --cov=src/vulnprio --cov-report=term-missing
