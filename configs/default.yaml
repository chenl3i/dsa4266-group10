# Base configuration. Experiment configs in configs/experiments/ are merged
# on top of this file (shallow-merged per top-level key).
seed: 4266

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  external: data/external
  reports: reports

sources:
  nvd:
    # Bulk JSON 2.0 year-files rather than the paged API: ~172 MB and a few
    # minutes instead of ~30 rate-limited minutes, no API key, and every file
    # ships a published sha256. The api mode is kept for later delta pulls.
    mode: feed
    # WIDER than data.cve_published_* on purpose. Feeds are partitioned by CVE
    # *ID* year, not publication date, so a CVE-2015-xxxx first published in
    # 2016 lives in the 2015 file. Narrowing this to the study window would drop
    # such records silently. Stage 2's date filter does the real narrowing.
    feed_year_min: 2015
    feed_year_max: 2026

data:
  # Only CVEs published within this window enter the study. Keeps the corpus
  # to CVSS v3.1-era records (v3.1 became the NVD default in mid-2019) so the
  # feature schema is consistent across the whole dataset.
  cve_published_min: "2016-01-01"
  cve_published_max: "2024-12-31"
  # Drop records the NVD has withdrawn or not yet scored.
  drop_rejected: true
  require_cvss_v31: true

labels:
  # Positive class = CVE appears in the CISA KEV catalogue.
  # observation_cutoff is the "as of" date for label collection: a CVE counts
  # as exploited only if its KEV dateAdded <= this date. Anything added later
  # is treated as unlabelled, NOT as a negative. See docs/decisions/0002.
  observation_cutoff: "2025-06-30"
  positive_source: kev

split:
  # Time-based, not random. See docs/decisions/0003.
  strategy: temporal
  train_end: "2022-12-31"     # CVEs published on/before this date -> train
  valid_end: "2023-06-30"     # ... and on/before this -> validation
  test_end: "2023-12-31"      # ... and on/before this -> test
  # Embargo: exclude CVEs published in the N days before train_end, because
  # their exploitation status has had less time to be observed than older ones.
  embargo_days: 180

features:
  # Feature blocks are toggled here and resolved through the registry in
  # vulnprio.features.base. Adding a block = new file + @register_block.
  blocks:
    cvss: true
    temporal: true
    cwe: true
    cpe: true
    references: true
    text: true
  text:
    vectorizer: tfidf
    max_features: 20000
    ngram_range: [1, 2]
    min_df: 5
    # Terms that leak the label (a description saying "exploited in the wild"
    # is often written *because* the CVE was exploited). See vulnprio.leakage.
    apply_leakage_blocklist: true

baselines:
  cvss: true
  epss: true
  random: true

models:
  # No model implementations yet - the registry is empty by design.
  # Add an entry here once vulnprio/models/<name>.py registers itself.
  enabled: []

evaluation:
  # The decision problem is "which top-k% do we patch?" - report across
  # plausible patch budgets, not a single threshold.
  k_percents: [0.5, 1, 2, 5, 10, 20]
  primary_metric: precision_at_k
  primary_k_percent: 10
  bootstrap_iterations: 1000
  bootstrap_confidence: 0.95
